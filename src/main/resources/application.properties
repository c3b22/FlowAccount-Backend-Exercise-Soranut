spring.application.name=product-management

# ให้แต่ละ request ทำงานบน virtual thread (Java 21) — เหมาะกับงาน I/O และ lock ช่วงสั้นๆ
spring.threads.virtual.enabled=true

# ไม่ให้ Jackson ปัดทศนิยมเป็นจำนวนเต็มเงียบๆ (เช่น stock: 1.5 ถูกแปลงเป็น 1) -> ตอบ 400 แทน
spring.jackson.deserialization.accept-float-as-int=false

# API docs: Swagger UI ที่ /swagger-ui.html, OpenAPI JSON ที่ /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
